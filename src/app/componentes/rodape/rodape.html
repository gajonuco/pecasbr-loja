      <p class="rodape-slogan">{{ 'rodape.slogan' | translate }}</p>

          <span class="rodape-texto">

              stroke-width="1.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/>

    </div>

    <!-- Coluna 3 — Redes sociais -->
    <div class="rodape-col">
      <p class="rodape-col-titulo">{{ 'rodape.redes_sociais' | translate }}</p>
      <ul class="rodape-lista">
        <li>
          <a href="https://instagram.com/pecasbr" target="_blank"
            rel="noopener noreferrer" class="rodape-link">
            <svg class="rodape-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/>

            &#64;pecasbr

        </li>
      </ul>
    </div>

  </div>

  <!-- Linha inferior -->
  <div class="rodape-bottom">
    <p class="rodape-copy">
      &copy; {{ anoAtual }} {{ 'rodape.direitos' | translate }}
    </p>
  </div>

</footer>
