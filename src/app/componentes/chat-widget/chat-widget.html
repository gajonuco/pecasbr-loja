<div class="chat-widget">
  <button class="chat-bubble" (click)="alternarAberto()" [attr.aria-label]="aberto() ? 'Fechar chat' : 'Abrir chat'">
    @if (aberto()) { ✕ } @else { 💬 }
  </button>

  @if (aberto()) {
    <div class="chat-janela">
      <div class="chat-cabecalho">Assistente Peças BR</div>

      <div class="chat-mensagens">
        @for (msg of mensagens(); track $index) {
          <div class="chat-mensagem" [class.cliente]="msg.autor === 'cliente'" [class.agente]="msg.autor === 'agente'">
            {{ msg.texto }}
          </div>
        }
        @if (carregando()) {
          <div class="chat-mensagem agente chat-carregando">Digitando...</div>
        }
      </div>

      <div class="chat-entrada">
        <input
          type="text"
          [(ngModel)]="mensagemAtual"
          (keyup.enter)="enviar()"
          placeholder="Pergunte sobre produtos..."
          [disabled]="carregando()"
        />
        <button (click)="enviar()" [disabled]="carregando()">Enviar</button>
      </div>
    </div>
  }
</div>
